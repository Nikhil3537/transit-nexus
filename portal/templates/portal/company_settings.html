{% extends "portal/_page_base.html" %}
{% block title %}Settings · Transit Nexus{% endblock %}
{% block content %}
<section class="panel">
  {% if messages %}{% for m in messages %}<div class="alert-success">{{ m }}</div>{% endfor %}{% endif %}
  <div class="panel-head"><h3>Account Settings</h3></div>
  <form method="post" class="form-grid">
    {% csrf_token %}
    <div><label>First Name</label><input type="text" name="first_name" value="{{ profile.user.first_name }}"></div>
    <div><label>Email</label><input type="email" name="email" value="{{ profile.user.email }}"></div>
    <div><label>Username</label><input type="text" value="{{ profile.user.username }}" disabled></div>
    <div style="grid-column: 1 / -1;"><button type="submit" class="btn-primary" style="width:auto; padding:11px 28px;">Save Changes</button></div>
  </form>
</section>
{% endblock %}
